# Docker Compose configuration for production environment
# Includes Next.js app, PostgreSQL database, and optional Nginx reverse proxy
# Start with: docker-compose -f docker-compose.prod.yml up -d --build

services:
  # Next.js application (production build)
  web:
    # Pinned so CI can build these tags with buildx (for the layer cache) and
    # then bring the stack up with --no-build. Interpolated rather than
    # hardcoded: it reproduces Compose's implicit "<project>-<service>" naming
    # exactly, so a fork checked out as daybreak/ still gets daybreak-web and
    # two stacks started with different -p values cannot overwrite each other's
    # images.
    image: ${COMPOSE_PROJECT_NAME:-sunrise}-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      # Explicit now that the Dockerfile has five stages. `runner` is still last,
      # so this is belt-and-braces rather than load-bearing.
      target: runner
      # Pass build-time environment variables required by Dockerfile ARGs
      # These must match what CI passes in .github/workflows/ci.yml
      # NEXT_PUBLIC_* vars are embedded into the JavaScript bundle during build
      # Other vars are needed for Next.js build-time environment validation
      args:
        - DATABASE_URL=${DATABASE_URL}
        - BETTER_AUTH_URL=${BETTER_AUTH_URL}
        - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        # Raise if `next build` OOMs here (FATAL ERROR: Reached heap limit) —
        # the wall #543 was about. Note this default is NOT what CI builds at:
        # CI passes `vars.CI_NODE_HEAP_MB || 5120`, so it always overrides the
        # Dockerfile's 4096, while a self-hosted build gets 4096 unless you set
        # NODE_HEAP_MB. Same lever, different default, on purpose — CI knows its
        # runner, this file cannot. Only raise it if the build host has the
        # memory, or a clean heap error becomes an OS-level kill.
        - NODE_HEAP_MB=${NODE_HEAP_MB:-4096}
    container_name: sunrise-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
    # Load all environment variables from .env file
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - sunrise-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Run-once migration service.
  # Applies pending Prisma migrations against `db` and exits. `web` waits
  # for this to complete successfully before starting, so the app never
  # serves traffic against a stale schema, and a failed migration keeps
  # `web` down.
  #
  # It builds the `migrator` TARGET — a different image from `web`. The Prisma
  # CLI's dependency closure is ~240 MB and was removed from the runtime image
  # in #583, so `exec web npx prisma …` no longer works; everything
  # Prisma-CLI-shaped goes through this service.
  #
  # The command comes from the stage's CMD (`npm run db:migrate:deploy`) so
  # there is one source of truth. No build args: this target needs none, and
  # passing the real DSN would record it in the image's `docker history`. The
  # DSN it actually migrates with comes from .env at run time.
  migrator:
    image: ${COMPOSE_PROJECT_NAME:-sunrise}-migrator:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: sunrise-migrator
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sunrise-network
    restart: 'no'

  # One-shot database seeder — profile-gated, so a plain `up` never builds or
  # starts it:
  #
  #   docker compose -f docker-compose.prod.yml --profile seed run --rm seeder
  #
  # REQUIRED on first install: creates the default knowledge base row that
  # runtime code FK-references, plus built-in agents, capabilities, templates
  # and provider models. Re-running is safe — each seed unit is content-hashed
  # and skipped when unchanged.
  #
  # A separate image because `npm run db:seed` is `tsx prisma/seed.ts`: tsx is a
  # devDependency and the seed units import from lib/. Neither is in the runtime
  # image, which is why the previously documented `exec web npm run db:seed`
  # never worked.
  #
  # No container_name — `compose run` warns and ignores it.
  seeder:
    profiles: ['seed']
    image: ${COMPOSE_PROJECT_NAME:-sunrise}-seeder:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: seeder
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - sunrise-network
    restart: 'no'

  # PostgreSQL database
  db:
    image: pgvector/pgvector:pg15
    container_name: sunrise-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-sunrise}
      - POSTGRES_INITDB_ARGS=-E UTF8
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      # Optional: Mount init scripts for database setup
      # - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - sunrise-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx reverse proxy (OPTIONAL)
  # Only needed for:
  # - Self-hosted deployments
  # - Custom SSL/caching/load balancing
  # - Multiple services behind one domain
  # For Vercel/Railway/Render, platform load balancers are sufficient
  nginx:
    image: nginx:alpine
    container_name: sunrise-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL certificates - comment out until you set up SSL
      # To enable HTTPS:
      # 1. Obtain SSL certificates (Let's Encrypt, Certbot, etc.)
      # 2. Place cert files in ./ssl/ directory
      # 3. Uncomment the line below
      # - ./ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - web
    networks:
      - sunrise-network

volumes:
  postgres_prod_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  sunrise-network:
    driver: bridge

# Usage Instructions:
#
# INITIAL DEPLOYMENT:
# ------------------
# 1. Create .env file with production values (see .env.example):
#    cp .env.example .env
#    # Edit .env with production credentials (especially BETTER_AUTH_SECRET and DATABASE_URL)
#
# 2. Build and start all services:
#    docker-compose -f docker-compose.prod.yml up -d --build
#
#    The `migrator` service runs automatically before `web` starts, applying
#    any pending Prisma migrations via `prisma migrate deploy`. No manual
#    migration step is required — `web` will not start if migrations fail.
#
# 3. Seed the database (REQUIRED on first install — creates the default
#    knowledge base row that runtime code FK-references; also seeds
#    built-in agents, capabilities, and templates):
#    docker-compose -f docker-compose.prod.yml --profile seed run --rm seeder
#
#    Runs in its own image: seeding needs tsx and the application source,
#    neither of which is in the runtime image.
#
# 4. Verify deployment (from the host — the runtime image has no curl):
#    curl http://localhost:3000/api/health
#    # Should return: {"status":"ok","services":{"database":{"status":"operational",...}}}
#
# ONGOING OPERATIONS:
# ------------------
# View logs:
#    docker-compose -f docker-compose.prod.yml logs -f web
#    docker-compose -f docker-compose.prod.yml logs -f db
#
# Check service health:
#    docker-compose -f docker-compose.prod.yml ps
#
# Restart a service:
#    docker-compose -f docker-compose.prod.yml restart web
#
# Apply new migrations (after pulling code with new schema changes):
#    docker-compose -f docker-compose.prod.yml up -d --build
#    # The `migrator` service re-runs automatically on each `up --build`.
#
# Check migration status without applying:
#    docker-compose -f docker-compose.prod.yml run --rm migrator prisma migrate status
#
# Re-seed after a release that adds seed units (safe to repeat — unchanged
# units are skipped):
#    docker-compose -f docker-compose.prod.yml --profile seed run --rm seeder
#
# Stop all services:
#    docker-compose -f docker-compose.prod.yml down
#
# Stop and remove volumes (WARNING: deletes database data):
#    docker-compose -f docker-compose.prod.yml down -v
#
# DEPLOYMENT AUTOMATION (CI/CD):
# -----------------------------
# For automated deployments, include these steps in your deployment script:
#
#   docker-compose -f docker-compose.prod.yml up -d --build --wait
#   # Migrations apply automatically via the `migrator` service before `web`
#   # starts; a non-zero migrator exit is the gate — `web` never comes up.
#   # --wait blocks until `web` is healthy. Without it, `up -d` returns as soon
#   # as containers start and the health check below races Next's boot.
#   curl -fsS http://localhost:3000/api/health
#
# Run the health check from the host, not `exec -T web curl …`: node:24-alpine
# ships no curl. Inside the container the equivalent is
# `wget -qO- http://localhost:3000/api/health`.
