name: Secret Scan

# Scans for committed credentials with TruffleHog (free for everyone,
# including org-owned repos — unlike gitleaks-action, which requires a paid
# license for organizations). On PRs it scans the diff; on schedule and manual
# runs it scans the full history (fetch-depth: 0). The job fails when a secret
# is found, so a leaked credential blocks the merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1' # Mondays 03:27 UTC — full-history sweep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for diff + scheduled full scans

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@v3.97.0
        with:
          # Report verified secrets AND ones TruffleHog cannot verify. The
          # `unknown` class is what catches a credential for a service TruffleHog
          # has no verifier for, or a revoked-but-still-committed key — so
          # dropping to `--results=verified` is a real reduction in coverage, not
          # a free tightening. Prefer extending the allowlist in
          # `.trufflehog-exclude.txt` (below) over narrowing the result classes.
          #
          # `unknown` matches by STRUCTURE, so a fixture/docs Postgres DSN that
          # points at nothing real still trips the Postgres detector. The
          # allowlist below exempts the paths where such strings are unavoidable.
          extra_args: --results=verified,unknown --exclude-paths=.trufflehog-exclude.txt

      # Defence in depth for the one credential type that provably lives in the
      # allowlisted paths. `.trufflehog-exclude.txt` exempts `tests/`, `.context/`
      # and `.claude/` wholesale, which means EVERY detector goes quiet there —
      # so a real Postgres DSN committed into a test fixture or a docs example
      # would not be reported. This check does not care about paths at all: it
      # scans every tracked file and fires only when a DSN pairs a non-placeholder
      # credential with a routable host, so a fixture cannot trip it.
      - name: Postgres DSN tripwire
        run: bash scripts/ci/check-postgres-dsn.sh
